name: looply
description: A Flutter video player and torrent downloader application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Theming
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  
  # Media & Video
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_android_video: ^1.3.6
  video_player: ^2.8.6
  flutter_video_info: ^1.1.5
  video_thumbnail: ^0.5.3
  photo_manager: ^3.2.1
  
  # Animations
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.1.2
  
  # File & Storage
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  
  # Sharing
  receive_sharing_intent: ^1.8.0
  
  # UI Components
  flutter_svg: ^2.0.10+1
  fluttertoast: ^8.2.6
  
  # Audio
  just_audio: ^0.9.38
  audio_session: ^0.1.21
  
  # System
  screen_brightness: 0.2.2+1
  volume_controller: ^2.0.7
  wakelock_plus: ^1.2.5
  shared_preferences: ^2.2.3
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  logger: ^2.6.2
  google_fonts: ^6.3.2
  flutter_volume_controller: ^1.3.3
  screenshot: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  dart_code_metrics: ^4.19.2

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/animation/
    - assets/Lot/
    - assets/Video/

  fonts:
    - family: CustomFont
      fonts:
        - asset: fonts/CustomFont-Regular.ttf
        - asset: fonts/CustomFont-Bold.ttf
          weight: 700
